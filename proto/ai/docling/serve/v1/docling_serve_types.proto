  INPUT_FORMAT_CALENDAR = 37;
}

// Output format types for converted documents.
enum OutputFormat {
  OUTPUT_FORMAT_UNSPECIFIED = 0;
  OUTPUT_FORMAT_DOCTAGS = 1;
  OUTPUT_FORMAT_HTML = 2;
  OUTPUT_FORMAT_HTML_SPLIT_PAGE = 3;
  OUTPUT_FORMAT_JSON = 4;
  OUTPUT_FORMAT_MARKDOWN = 5;
  OUTPUT_FORMAT_TEXT = 6;
  OUTPUT_FORMAT_YAML = 7;
  OUTPUT_FORMAT_VTT = 8;
  OUTPUT_FORMAT_DOCLANG = 9;
  OUTPUT_FORMAT_DCLX = 10;
  OUTPUT_FORMAT_CHUNKS = 11;
  // Docling >=2.124: LaTeX export via LaTeXDocSerializer.
  OUTPUT_FORMAT_LATEX = 12;
}

// OCR engine selection.
enum OcrEngine {
  OCR_ENGINE_UNSPECIFIED = 0;
  OCR_ENGINE_AUTO = 1;
  OCR_ENGINE_EASYOCR = 2;
  OCR_ENGINE_OCRMAC = 3;
  OCR_ENGINE_RAPIDOCR = 4;
  // Legacy kind string "tesserocr" (Python bindings). Prefer OCR_ENGINE_TESSERACT
  // for the Pydantic OcrEngine.TESSERACT value ("tesseract").
  OCR_ENGINE_TESSEROCR = 5;
  OCR_ENGINE_TESSERACT = 6;
  // Pydantic OcrEngine.TESSERACT_CLI — Tesseract via the CLI binary.
  OCR_ENGINE_TESSERACT_CLI = 7;
}

// PDF processing backend.
enum PdfBackend {
  PDF_BACKEND_UNSPECIFIED = 0;
  PDF_BACKEND_DLPARSE_V1 = 1;
  PDF_BACKEND_DLPARSE_V2 = 2;
  PDF_BACKEND_DLPARSE_V4 = 3;
  PDF_BACKEND_PYPDFIUM2 = 4;
  PDF_BACKEND_DOCLING_PARSE = 5;
  PDF_BACKEND_THREADED_DOCLING_PARSE = 6;
}

// Table structure extraction mode.
enum TableFormerMode {
  TABLE_FORMER_MODE_UNSPECIFIED = 0;
  TABLE_FORMER_MODE_ACCURATE = 1;
  TABLE_FORMER_MODE_FAST = 2;
}

// Document processing pipeline.
enum ProcessingPipeline {
  PROCESSING_PIPELINE_UNSPECIFIED = 0;
  PROCESSING_PIPELINE_ASR = 1;
  PROCESSING_PIPELINE_STANDARD = 2;
  PROCESSING_PIPELINE_VLM = 3;
  PROCESSING_PIPELINE_LEGACY = 4;
  // Model-free PDF text/image extract via docling-parse (docling-slim 2.126+).
  PROCESSING_PIPELINE_NATIVE = 5;
}

// Image reference mode for export.
enum ImageRefMode {
  IMAGE_REF_MODE_UNSPECIFIED = 0;
  IMAGE_REF_MODE_EMBEDDED = 1;
  IMAGE_REF_MODE_PLACEHOLDER = 2;
  IMAGE_REF_MODE_REFERENCED = 3;
}

// Where captions sit relative to the item they caption (docling-core
// CaptionPlacement). STANDARD is the per-type order; LAYOUT uses bbox centers.
enum CaptionPlacement {
  CAPTION_PLACEMENT_UNSPECIFIED = 0;
  CAPTION_PLACEMENT_STANDARD = 1;
  CAPTION_PLACEMENT_LAYOUT = 2;
}

// Parsing contract for chart-extraction model output
// (ChartExtractionOutputFormat).
enum ChartExtractionOutputFormat {
  CHART_EXTRACTION_OUTPUT_FORMAT_UNSPECIFIED = 0;
  CHART_EXTRACTION_OUTPUT_FORMAT_GRANITE_VISION_CHARTS = 1;
  // CSV-only Granite Vision Chart2CSV contract (granite_vision_v3_3 preset;
  // Pydantic value "granite_vision_chart2csv").
  CHART_EXTRACTION_OUTPUT_FORMAT_GRANITE_VISION_CHART2CSV = 2;
}

// Preset VLM model types. Names mirror the upstream
// docling.datamodel.pipeline_options.VlmModelType enum.
enum VlmModelType {
  VLM_MODEL_TYPE_UNSPECIFIED = 0;
  VLM_MODEL_TYPE_SMOLDOCLING = 1;
  VLM_MODEL_TYPE_SMOLDOCLING_VLLM = 2;
  VLM_MODEL_TYPE_GRANITE_VISION = 3;
  VLM_MODEL_TYPE_GRANITE_VISION_VLLM = 4;
  VLM_MODEL_TYPE_GRANITE_VISION_OLLAMA = 5;
  VLM_MODEL_TYPE_GOT_OCR_2 = 6;
  VLM_MODEL_TYPE_GRANITEDOCLING = 7;
  VLM_MODEL_TYPE_GRANITEDOCLING_VLLM = 8;
  VLM_MODEL_TYPE_DEEPSEEKOCR_OLLAMA = 9;
  VLM_MODEL_TYPE_NANONETS_OCR2 = 10;
  VLM_MODEL_TYPE_NANONETS_OCR2_VLLM = 11;
  VLM_MODEL_TYPE_NANONETS_OCR2_LMSTUDIO = 12;
  VLM_MODEL_TYPE_GLMOCR = 13;
  VLM_MODEL_TYPE_GLMOCR_VLLM = 14;
  VLM_MODEL_TYPE_LIGHTONOCR = 15;
  VLM_MODEL_TYPE_LIGHTONOCR_VLLM = 16;
}

// Response format for VLM model output.
// Tags 1-5 stay as first published. Later members follow docling 2.142.1's
// ResponseFormat and keep their own tags; declaration order is not the wire id.
enum ResponseFormat {
  RESPONSE_FORMAT_UNSPECIFIED = 0;
  RESPONSE_FORMAT_DOCTAGS = 1;
  RESPONSE_FORMAT_MARKDOWN = 2;
  RESPONSE_FORMAT_HTML = 3;
  RESPONSE_FORMAT_OTSL = 4;
  RESPONSE_FORMAT_PLAINTEXT = 5;
  RESPONSE_FORMAT_DOCLANG = 6;
  RESPONSE_FORMAT_DEEPSEEKOCR_MARKDOWN = 7;
  RESPONSE_FORMAT_UNLIMITED_OCR_MARKDOWN = 8;
  RESPONSE_FORMAT_CHANDRA_HTML = 9;
  RESPONSE_FORMAT_DOTS_JSON = 10;
  RESPONSE_FORMAT_NEMOTRON_PARSE_V2 = 11;
  RESPONSE_FORMAT_NEMOTRON_PARSE_V3_5 = 12;
  RESPONSE_FORMAT_MINERU2 = 13;
  RESPONSE_FORMAT_SURYA_HTML = 14;
  RESPONSE_FORMAT_LIGHTONOCR_MARKDOWN = 15;
  RESPONSE_FORMAT_UNLIMITED_OCR2 = 16;
}

// Inference framework for local VLM models.
enum InferenceFramework {
  INFERENCE_FRAMEWORK_UNSPECIFIED = 0;
  INFERENCE_FRAMEWORK_MLX = 1;
  INFERENCE_FRAMEWORK_TRANSFORMERS = 2;
  INFERENCE_FRAMEWORK_VLLM = 3;
}

// Type of transformers auto-model to use. Names mirror the upstream
// docling TransformersModelType enum.
enum TransformersModelType {
  TRANSFORMERS_MODEL_TYPE_UNSPECIFIED = 0;
  TRANSFORMERS_MODEL_TYPE_AUTOMODEL = 1;
  TRANSFORMERS_MODEL_TYPE_AUTOMODEL_IMAGETEXTTOTEXT = 2;
  TRANSFORMERS_MODEL_TYPE_AUTOMODEL_CAUSALLM = 3;
}

// Async task status.
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_STARTED = 2;
  TASK_STATUS_SUCCESS = 3;
  TASK_STATUS_FAILURE = 4;
}

// TaskType mirrors docling's TaskType enum (convert | chunk).
enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  TASK_TYPE_CONVERT = 1;
  TASK_TYPE_CHUNK = 2;
}

// QualityGrade mirrors docling's QualityGrade. Pydantic's "unspecified" member
// maps to the zero value; the *_raw companion carries any newer grade name.
enum QualityGrade {
  QUALITY_GRADE_UNSPECIFIED = 0;
  QUALITY_GRADE_POOR = 1;
  QUALITY_GRADE_FAIR = 2;
  QUALITY_GRADE_GOOD = 3;
  QUALITY_GRADE_EXCELLENT = 4;
}

// FailureCategory mirrors docling's FailureCategory (shared by task-scope
// PublicFailureInfo and document-scope errors).
enum FailureCategory {
  FAILURE_CATEGORY_UNSPECIFIED = 0;
  FAILURE_CATEGORY_POLICY = 1;
  FAILURE_CATEGORY_CAPACITY = 2;
  FAILURE_CATEGORY_SOURCE_UNAVAILABLE = 3;
  FAILURE_CATEGORY_TARGET_UNAVAILABLE = 4;
  FAILURE_CATEGORY_TIMEOUT = 5;
  FAILURE_CATEGORY_INTERNAL = 6;
  FAILURE_CATEGORY_BACKEND_FAILURE = 7;
  FAILURE_CATEGORY_INFERENCE_FAILURE = 8;
  FAILURE_CATEGORY_UNKNOWN = 9;
}

// FailurePhase mirrors docling's FailurePhase.
enum FailurePhase {
  FAILURE_PHASE_UNSPECIFIED = 0;
  FAILURE_PHASE_ADMISSION = 1;
  FAILURE_PHASE_SOURCE_ENUMERATION = 2;
  FAILURE_PHASE_EXECUTION = 3;
  FAILURE_PHASE_ORCHESTRATION = 4;
}

// ArtifactType mirrors the ArtifactRef.artifact_type literal set.
enum ArtifactType {
  ARTIFACT_TYPE_UNSPECIFIED = 0;
  ARTIFACT_TYPE_JSON = 1;
  ARTIFACT_TYPE_HTML = 2;
  ARTIFACT_TYPE_MARKDOWN = 3;
  ARTIFACT_TYPE_TEXT = 4;
  ARTIFACT_TYPE_DOCTAGS = 5;
  ARTIFACT_TYPE_DOCLANG = 6;
  ARTIFACT_TYPE_DCLX = 7;
  ARTIFACT_TYPE_RESOURCE_BUNDLE = 8;
  // Chunk export artifact (Pydantic literal "chunks").
  ARTIFACT_TYPE_CHUNKS = 9;
}

enum PictureClassificationLabel {
