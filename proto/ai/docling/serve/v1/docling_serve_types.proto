message ConvertDocumentOptions {
  repeated InputFormat from_formats = 1;
  repeated OutputFormat to_formats = 2;
  optional ImageRefMode image_export_mode = 3;
  optional bool do_ocr = 4;
  optional bool force_ocr = 5;
  optional OcrEngine ocr_engine = 6;
  repeated string ocr_lang = 7;
  optional PdfBackend pdf_backend = 8;
  optional TableFormerMode table_mode = 9;
  optional bool table_cell_matching = 10;
  optional ProcessingPipeline pipeline = 11;
  optional ai.docling.core.v1.IntSpan page_range = 12;
  optional double document_timeout = 13;
  optional bool abort_on_error = 14;
  optional bool do_table_structure = 15;
  optional bool include_images = 16;
  optional double images_scale = 17;
  optional string md_page_break_placeholder = 18;
  optional bool do_code_enrichment = 19;
  optional bool do_formula_enrichment = 20;
  optional bool do_picture_classification = 21;
  optional bool do_picture_description = 22;
  optional double picture_description_area_threshold = 23;
  optional PictureDescriptionLocal picture_description_local = 24;
  optional PictureDescriptionApi picture_description_api = 25;
  optional VlmModelType vlm_pipeline_model = 26;
  optional VlmModelLocal vlm_pipeline_model_local = 27;
  optional VlmModelApi vlm_pipeline_model_api = 28;
  optional bool do_chart_extraction = 29;
  // Unknown or admin-alias id. Tag 30 is the original string field.
  optional string vlm_pipeline_preset_raw = 30;
  optional string picture_description_preset_raw = 31;
  optional string code_formula_preset_raw = 32;
  optional VlmConvertOptions vlm_pipeline_custom_config = 33;
  optional PictureDescriptionVlmEngineOptions picture_description_custom_config = 34;
  optional CodeFormulaVlmOptions code_formula_custom_config = 35;
  map<string, ScalarValue> table_structure_custom_config = 36;
  map<string, ScalarValue> layout_custom_config = 37;
  optional string ocr_preset_raw = 38;
  // Fallback for keys the selected OCR message does not define. When
  // `ocr_options` is set, a key that message already defines is an error.
  // The typed value is not overridden. When `ocr_options` is unset, this map
  // is the whole custom config, including `kind`, as jobkit expects.
  map<string, ScalarValue> ocr_custom_config = 39;
  optional string table_structure_preset_raw = 40;
  optional string layout_preset_raw = 41;
  optional string picture_classification_preset_raw = 42;
  map<string, ScalarValue> picture_classification_custom_config = 43;
  optional bool include_page_images = 44;
  optional bool do_pdf_heading_hierarchy = 45;
  optional HeadingHierarchyOptions pdf_heading_hierarchy_options = 46;
  // Docling >=2.122: compact markdown tables without column padding.
  optional bool md_compact_tables = 47;
  // Unknown or admin-alias chunking id. Mutually exclusive with chunking_options.
  // Tag 48 is the original string field.
  optional string chunking_preset_raw = 48;
  // Chunker configuration for OUTPUT_FORMAT_CHUNKS; mirrors the Pydantic
  // `chunker`-discriminated union. Mutually exclusive with chunking_preset.
  oneof chunking_options {
    HierarchicalChunkerOptions hierarchical_chunking = 49;
    HybridChunkerOptions hybrid_chunking = 50;
  }
  // Markdown caption order (docling-core CaptionPlacement). Unset keeps the
  // engine's standard order. Mutually exclusive values are the enum itself.
  optional CaptionPlacement caption_placement = 51;
  // Unknown chart-extraction id. Mutually exclusive with
  // chart_extraction_custom_config. Tag 52 is the original string field.
  optional string chart_extraction_preset_raw = 52;
  optional ChartExtractionVlmEngineOptions chart_extraction_custom_config = 53;
  // Typed OCR engine options (slim 2.145). The arm is the factory kind.
  // Precedence: the arm owns every field of that message. `ocr_custom_config`
  // may only add keys the message does not define. A repeated key is an error.
  // A non-auto `ocr_preset`, or an `ocr_engine` whose string is not the arm's
  // kind, is an error. `ocr_lang` fills `lang` only when the arm left `lang`
  // unset. Unset optional fields are omitted from the dict jobkit splats into
  // `ocr_factory.create_options`, so the engine default stays in place.
  // Explicit false is written as false.
  oneof ocr_options {
    OcrAutoOptions ocr_auto = 54;
    EasyOcrOptions easyocr = 55;
    // kind "tesserocr"
    TesseractOcrOptions tesseract = 56;
    // kind "tesseract"
    TesseractCliOcrOptions tesseract_cli = 57;
    RapidOcrOptions rapidocr = 58;
    OcrMacOptions ocrmac = 59;
    NemotronOcrOptions nemotron_ocr = 60;
    KserveV2OcrOptions kserve_v2_ocr = 61;
  }
  // Registry preset ids. An id this build does not name stays on the *_raw
  // companion (the original string tag). The serve alias "default" is not a
  // registry id and uses the raw field.
  optional VlmPipelinePreset vlm_pipeline_preset = 62;
  optional PictureDescriptionPreset picture_description_preset = 63;
  optional CodeFormulaPreset code_formula_preset = 64;
  optional OcrPreset ocr_preset = 65;
  optional TableStructurePreset table_structure_preset = 66;
  optional LayoutPreset layout_preset = 67;
  optional PictureClassificationPreset picture_classification_preset = 68;
  optional ChunkingPreset chunking_preset = 69;
  optional ChartExtractionPreset chart_extraction_preset = 70;
}

// ============================================================================
// Error types
// ============================================================================

// ConversionStatus mirrors docling's ConversionStatus enum.
enum ConversionStatus {
  CONVERSION_STATUS_UNSPECIFIED = 0;
  CONVERSION_STATUS_PENDING = 1;
  CONVERSION_STATUS_STARTED = 2;
  CONVERSION_STATUS_FAILURE = 3;
  CONVERSION_STATUS_SUCCESS = 4;
  CONVERSION_STATUS_PARTIAL_SUCCESS = 5;
  CONVERSION_STATUS_SKIPPED = 6;
}

// DoclingComponentType mirrors docling's DoclingComponentType enum.
enum DoclingComponentType {
  DOCLING_COMPONENT_TYPE_UNSPECIFIED = 0;
  DOCLING_COMPONENT_TYPE_DOCUMENT_BACKEND = 1;
  DOCLING_COMPONENT_TYPE_MODEL = 2;
  DOCLING_COMPONENT_TYPE_DOC_ASSEMBLER = 3;
  DOCLING_COMPONENT_TYPE_USER_INPUT = 4;
  DOCLING_COMPONENT_TYPE_PIPELINE = 5;
}

// ErrorItem represents a processing error from a specific component.
message ErrorItem {
  DoclingComponentType component_type = 1;
  string error_message = 2;
  string module_name = 3;
  // Raw component type fallback for forward-compatibility with newer
  // docling component vocabularies (populated when component_type is
  // DOCLING_COMPONENT_TYPE_UNSPECIFIED but the source had a value).
  optional string component_type_raw = 4;
  // Semantic category of the error for filtering (docling ErrorItem.category).
  FailureCategory category = 5;
  optional string category_raw = 6;
  // 1-indexed page the error is attributable to; unset for document-scoped
  // errors (docling ErrorItem.page_no).
  optional int32 page_no = 7;
}

// PublicFailureInfo mirrors docling's task-scope failure model. Populated on
// TaskStatusPollResponse.failure and TaskFailureResult.failure.
message PublicFailureInfo {
  FailureCategory category = 1;
  string message = 2;
  bool retryable = 3;
  FailurePhase phase = 4;
  // Pydantic dict[str, str]; jobkit only emits allow-listed string keys.
  map<string, string> details = 5;
  // Raw fallbacks for newer category / phase vocabularies.
  optional string category_raw = 6;
  optional string phase_raw = 7;
}

// ============================================================================
// Quality / artifact types
// ============================================================================

// ConfidenceScores mirrors docling's JSON-safe confidence snapshot. The top
// level carries document scores and `pages` carries one snapshot per page;
// Pydantic coerces NaN to null, so absent means unknown.
message ConfidenceScores {
  optional double parse_score = 1;
  optional double layout_score = 2;
  optional double table_score = 3;
  optional double ocr_score = 4;
  optional double mean_score = 5;
  optional double low_score = 6;
  QualityGrade mean_grade = 7;
  QualityGrade low_grade = 8;
  // Raw fallbacks for newer grade vocabularies.
  optional string mean_grade_raw = 9;
  optional string low_grade_raw = 10;
  // Per-page scores keyed by 1-based page number (docling 2.140
  // ConfidenceScores.pages). Page entries are flat: their own `pages` map is
  // always empty. Pydantic types the field Optional[dict] with a {} default;
  // docling never emits None, and proto has no null map, so None and {} both
  // encode as an empty map and decode to {}.
  map<int32, ConfidenceScores> pages = 11;
}

// ProfilingScope mirrors docling.utils.profiling.ProfilingScope.
enum ProfilingScope {
  PROFILING_SCOPE_UNSPECIFIED = 0;
  PROFILING_SCOPE_PAGE = 1;
  PROFILING_SCOPE_DOCUMENT = 2;
}

// ProfilingItem mirrors docling.utils.profiling.ProfilingItem — the full
// timing sample REST returns under ConvertDocumentResponse.timings values.
// The parallel map<string, double> timings fields keep totals for older
// clients; this map carries scope/count/samples when present.
message ProfilingItem {
  ProfilingScope scope = 1;
  optional string scope_raw = 2;
  int32 count = 3;
  repeated double times = 4;
  // ISO-8601 timestamps matching Pydantic's JSON mode for datetime.
  repeated string start_timestamps = 5;
}

// ArtifactRef mirrors docling's ArtifactRef: one exported artifact reachable
// through a (usually presigned) URI.
message ArtifactRef {
  ArtifactType artifact_type = 1;
  string mime_type = 2;
  string uri = 3;
  // Pydantic datetime | None, carried as RFC 3339 text.
  optional string url_expires_at = 4;
  // Raw fallback for newer artifact type vocabularies.
  optional string artifact_type_raw = 5;
}

// DocumentArtifactItem mirrors docling's per-document result for
// PresignedUrlTarget responses.
message DocumentArtifactItem {
  int32 source_index = 1;
  string source_uri = 2;
  string filename = 3;
  ConversionStatus status = 4;
  repeated ErrorItem errors = 5;
  map<string, double> timings = 6;
  repeated ArtifactRef artifacts = 7;
  optional ConfidenceScores confidence = 8;
  optional string status_raw = 9;
  // Full ProfilingItem samples (additive; timings keeps totals).
  map<string, ProfilingItem> profiling = 10;
}

// ============================================================================
// Document response types
// ============================================================================

// DocumentExports contains optional serialized output formats.
message DocumentExports {
  // Canonical Docling JSON document (same serialization as REST).
  optional string json = 1;
  optional string md = 2;
  optional string html = 3;
  optional string text = 4;
  optional string doctags = 5;
  // Docling >=2.124 / jobkit 3.5: in-body DocLang markup.
  optional string doclang = 6;
  // Docling >=2.124: LaTeX serialization of the converted document.
  optional string latex = 7;
  // OutputFormat.YAML — DoclingDocument as YAML (same shape as save_as_yaml).
  optional string yaml = 8;
  // OutputFormat.VTT — WebVTT cues from track-timed text.
  optional string vtt = 9;
  // OutputFormat.HTML_SPLIT_PAGE — HTML with split_page_view=True.
  optional string html_split_page = 10;
  // OutputFormat.DCLX — DocLang OPC archive bytes (ZIP with document.xml).
  optional bytes dclx = 11;
}

// DocumentResponse contains the converted document and optional exports.
message DocumentResponse {
  // Filename of the source document
  string filename = 1;
  // Native protobuf DoclingDocument (always present)
  ai.docling.core.v1.DoclingDocument doc = 2;
  // Optional serialized outputs (markdown/html/text/doctags/json)
  optional DocumentExports exports = 3;
}

// ExportDocumentResponse is the document format used within chunk responses.
message ExportDocumentResponse {
  string filename = 1;
  ai.docling.core.v1.DoclingDocument doc = 2;
  optional DocumentExports exports = 3;
}

// Document wraps an exported document with status and error info.
message Document {
  optional string kind = 1;
  ExportDocumentResponse content = 2;
  ConversionStatus status = 3;
  repeated ErrorItem errors = 4;
  // Raw status fallback for forward-compatibility with newer docling
  // conversion status vocabularies.
  optional string status_raw = 5;
  // Per-document profiling totals (seconds), keyed by stage.
  map<string, double> timings = 6;
  optional ConfidenceScores confidence = 7;
  // Full ProfilingItem samples (additive; timings keeps totals).
  map<string, ProfilingItem> profiling = 8;
}

// ============================================================================
// Task types
// ============================================================================

// TaskStatusMetadata mirrors TaskProcessingMeta.
message TaskStatusMetadata {
  int64 num_docs = 1;
  int64 num_processed = 2;
  int64 num_succeeded = 3;
  int64 num_failed = 4;
  int64 num_partially_succeeded = 5;
}

// CallbackSpec mirrors docling's CallbackSpec: an HTTP endpoint the
// orchestrator POSTs progress updates to (see ProgressCallbackRequest).
message CallbackSpec {
  string url = 1;
  map<string, string> headers = 2;
  string ca_cert = 3;
}

// ============================================================================
// Result union members (mirror docling's DoclingTaskResult.result arms)
// ============================================================================

// ZipArchiveResult mirrors docling's ZipArchiveResult (ZipTarget).
// `kind` stays off the wire. `filename` is copied only when the producer
// set it. Unset is not an empty string. Slim 2.143 added the field. Jobkit
// 3.9.1 still builds the archive without a name, so the wire value stays
// unset until a producer sets it. Clients keep their current fallback.
message ZipArchiveResult {
  bytes content = 1;
  optional string filename = 2;
}

// RemoteTargetResult mirrors the REST PresignedUrlConvertDocumentResponse
// returned for S3 / Azure / GCS / Drive / Put targets: counts only, the
// documents were pushed to the remote target.
message RemoteTargetResult {
  double processing_time = 1;
  int64 num_converted = 2;
  int64 num_succeeded = 3;
  int64 num_partially_succeeded = 4;
  int64 num_failed = 5;
}

// PresignedArtifactResult mirrors the REST PresignedUrlConvertResponse
// returned for PresignedUrlTarget: counts plus per-document artifact refs.
message PresignedArtifactResult {
  double processing_time = 1;
  int64 num_converted = 2;
  int64 num_succeeded = 3;
  int64 num_partially_succeeded = 4;
  int64 num_failed = 5;
  repeated DocumentArtifactItem documents = 6;
}

// TaskFailureResult mirrors docling's TaskFailureResult: the task finished
// with a task-scope failure and produced no documents.
message TaskFailureResult {
  PublicFailureInfo failure = 1;
}

// ============================================================================
// Progress kinds (mirror docling's ProgressCallbackRequest.progress union)
// ============================================================================

// ProgressSetNumDocs mirrors docling's ProgressSetNumDocs.
message ProgressSetNumDocs {
  int64 num_docs = 1;
}

// ProcessedDocsItem mirrors docling's ProcessedDocsItem.
message ProcessedDocsItem {
  string source = 1;
  ConversionStatus status = 2;
  optional string error = 3;
  optional string status_raw = 4;
}

// ProgressUpdateProcessed mirrors docling's ProgressUpdateProcessed.
message ProgressUpdateProcessed {
  int64 num_processed = 1;
  int64 num_succeeded = 2;
  int64 num_partially_succeeded = 3;
  int64 num_failed = 4;
  repeated ProcessedDocsItem docs = 5;
}

// DocumentCompletedItem mirrors docling's DocumentCompletedItem.
message DocumentCompletedItem {
  string source = 1;
  ConversionStatus status = 2;
  optional InputFormat document_type = 3;
  optional int64 num_pages = 4;
  optional int64 num_characters = 5;
  optional int64 num_tables = 6;
  optional int64 num_pictures = 7;
  optional double processing_time = 8;
  optional string doc_hash = 9;
  optional string error = 10;
  optional string status_raw = 11;
  optional string document_type_raw = 12;
}

// ProgressDocumentCompleted mirrors docling's ProgressDocumentCompleted.
message ProgressDocumentCompleted {
  DocumentCompletedItem document = 1;
  int64 total_processed = 2;
  optional int64 total_docs = 3;
}

// ProgressTaskCompleted mirrors docling's ProgressTaskCompleted. task_status is
// Literal["success", "failure"] upstream; only those TaskStatus members occur.
message ProgressTaskCompleted {
  TaskStatus task_status = 1;
  optional PublicFailureInfo failure = 2;
}

// TaskProgress is the typed union of docling progress kinds. Pydantic
// discriminates on `kind`; the oneof tag carries that here.
message TaskProgress {
  oneof progress {
    ProgressSetNumDocs set_num_docs = 1;
    ProgressUpdateProcessed update_processed = 2;
    ProgressDocumentCompleted document_completed = 3;
    ProgressTaskCompleted task_completed = 4;
  }
}

// ============================================================================
// Request / Response Domain Models (Moved from docling_serve.proto)
// ============================================================================

// ConvertDocumentRequest mirrors POST /v1/convert/source
message ConvertDocumentRequest {
  repeated Source sources = 1;
  ConvertDocumentOptions options = 2;
  optional Target target = 3;
  // Progress callbacks (ConvertSourcesRequest.callbacks). Rejected when the
  // service policy disables callbacks.
  repeated CallbackSpec callbacks = 4;
  // gRPC form of the REST Accept-Docling-Document-Version header.
  // Pattern ^\d{1,9}\.\d{1,9}\.\d{1,9}$. Versions below 1.{FIRST_SUPPORTED_MINOR}.0
  // are rejected. JSON exports and JSON target files are down-projected to it.
  // The typed DoclingDocument stays on the current schema.
  optional string target_document_version = 5;
}

// BatchConvertDocumentRequest mirrors POST /v1/convert/source/batch
// (BatchConvertSourcesRequest). Sources are storage connectors (http, s3,
// azure_blob, google_cloud_storage, google_drive, generic); targets are
// storage targets or presigned_url. `targets` takes precedence over the
// singular `target` convenience field; at least one is required.
message BatchConvertDocumentRequest {
  ConvertDocumentOptions options = 1;
  repeated Source sources = 2;
  optional Target target = 3;
  repeated Target targets = 4;
  repeated CallbackSpec callbacks = 5;
  // Same contract as ConvertDocumentRequest.target_document_version.
  optional string target_document_version = 6;
}

// ConvertDocumentResponse mirrors the REST convert response body.
message ConvertDocumentResponse {
  DocumentResponse document = 1;
  repeated ErrorItem errors = 2;
  double processing_time = 3;
  ConversionStatus status = 4;
  map<string, double> timings = 5;
  // Raw status fallback for forward-compatibility with newer docling
  // conversion status vocabularies.
  optional string status_raw = 6;
  optional ConfidenceScores confidence = 7;
  // Full ProfilingItem samples (additive; timings keeps totals).
  map<string, ProfilingItem> profiling = 8;
}

// HierarchicalChunkerOptions configures the hierarchical chunker.
message HierarchicalChunkerOptions {
  bool use_markdown_tables = 1;
  bool include_raw_text = 2;
  optional bool use_markdown_images = 3;
  optional string image_placeholder = 4;
}

// HybridChunkerOptions configures the hybrid chunker.
message HybridChunkerOptions {
  bool use_markdown_tables = 1;
  bool include_raw_text = 2;
  optional int32 max_tokens = 3;
  optional string tokenizer = 4;
  optional bool merge_peers = 5;
  optional bool use_markdown_images = 6;
  optional string image_placeholder = 7;
}

// HierarchicalChunkRequest mirrors POST /v1/chunk/hierarchical/source
message HierarchicalChunkRequest {
  repeated Source sources = 1;
  ConvertDocumentOptions convert_options = 2;
  optional Target target = 3;
  bool include_converted_doc = 4;
  HierarchicalChunkerOptions chunking_options = 5;
  repeated CallbackSpec callbacks = 6;
}

// HybridChunkRequest mirrors POST /v1/chunk/hybrid/source
message HybridChunkRequest {
  repeated Source sources = 1;
  ConvertDocumentOptions convert_options = 2;
  optional Target target = 3;
  bool include_converted_doc = 4;
  HybridChunkerOptions chunking_options = 5;
  repeated CallbackSpec callbacks = 6;
}

// Chunk represents a single document chunk in the response.
message Chunk {
  // Tag 10 carried metadata as map<string, string> (lossy str() coercion).
  reserved 10;

  string filename = 1;
  int32 chunk_index = 2;
  string text = 3;
  optional string raw_text = 4;
  optional int32 num_tokens = 5;
  repeated string headings = 6;
  repeated string captions = 7;
  repeated string doc_items = 8;
  repeated int32 page_numbers = 9;
  // Pydantic dict | None: chunker-specific scalars keep their types.
  map<string, ScalarValue> metadata = 11;
}

// ChunkDocumentResponse mirrors the REST chunk response body.
// chunking_info is the jobkit ChunkedDocumentResult dump of the active
// chunker options (Optional[dict]); REST ChunkDocumentResponse currently
// omits it. Scalar leaves only — nested values are flattened like Chunk.metadata.
message ChunkDocumentResponse {
  repeated Chunk chunks = 1;
  repeated Document documents = 2;
  double processing_time = 3;
  map<string, ScalarValue> chunking_info = 4;
}

// TaskStatusPollRequest mirrors GET /v1/status/poll/{taskId}
message TaskStatusPollRequest {
  string task_id = 1;
  // Wait time in seconds (0 = no wait / immediate poll)
  double wait_time = 2;
}

// TaskStatusPollResponse mirrors the REST TaskStatusResponse.
message TaskStatusPollResponse {
  // Tag 2 carried task_type as a free string.
  reserved 2;

  string task_id = 1;
  TaskStatus task_status = 3;
  optional int64 task_position = 4;
  optional TaskStatusMetadata task_meta = 5;
  TaskType task_type = 6;
  // Raw fallback for newer task type vocabularies.
  optional string task_type_raw = 7;
  // Sanitized public error text for failed tasks (build_public_task_error).
  optional string error_message = 8;
  // Structured task-scope failure for failed tasks.
  optional PublicFailureInfo failure = 9;
}

// TaskResultRequest mirrors GET /v1/result/{taskId}
message TaskResultRequest {
  string task_id = 1;
}

// ClearResponse mirrors the REST clear response body.
message ClearResponse {
  optional string status = 1;
}
