// OcrLang is a presence wrapper. Proto3 repeated fields cannot be optional,
// and an empty language list is a real value (the engine's own default, which
// for Tesseract is per-page script detection). An omitted `lang` leaves the
// engine class default in place. An empty `values` list is explicit.
message OcrLang {
  repeated string values = 1;
}

// One gRPC channel argument. The value is a scalar. Nested values are rejected
// rather than encoded as JSON.
message KserveGrpcChannelArg {
  optional string key = 1;
  ScalarValue value = 2;
}

// OcrOptionsBase mirrors the stored fields of docling's OcrOptions (slim
// 2.145.0). Every scalar is optional so an omitted field is not the same as
// false, 0, or empty. `kind` is the ConvertDocumentOptions.ocr_options oneof
// arm, not a field. `force_full_page_ocr` is the deprecated computed alias of
// `mode = FULL_PAGE`. It is not a stored Pydantic field. Setting it true is
// the old name for full-page mode. `bitmap_area_threshold` was removed from
// OcrOptions and is not a field here. A key the selected message does not
// define still travels in ocr_custom_config.
message OcrOptionsBase {
  optional OcrMode mode = 1;
  optional string mode_raw = 2;
  OcrLang lang = 3;
  optional double scale = 4;
  optional bool replace_broken_text_layer = 5;
  optional bool force_full_page_ocr = 6;
}

